# User Configuration for ${keyboard.name}

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable ZMK Studio (runtime keymap editing).
# The USB transport for Studio is provided by the `studio-rpc-usb-uart`
# snippet, which is added to the vl03 build in build.yaml.
CONFIG_ZMK_STUDIO=y

# Tamano de la cola de comportamientos.
# Cada tecla de una macro ocupa DOS lugares: uno al presionar y otro al
# soltar. Las macros de URL (https://canicasync.com/App/Solicitud y
# similares) rondan las 40 teclas, o sea unos 80 lugares. Con el valor
# por defecto de 64 la cola se desborda, se pierde el evento de soltar,
# y Windows repite la ultima letra hasta el infinito.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
